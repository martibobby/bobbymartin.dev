name: Spell Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install hunspell
        run: |
          apt-get update
          apt-get install hunspell
          apt-get install hunspell-en-us
      - name: Check hunspell dictionaries
        run: hunspell -D
      - name: Print wd
        run: ls -l 
      - name: Check if hunspell works with pipe 
        run: echo frqy refries | hunspell -a -d en_US
      - name: Spell Check resume.yml
        run: hunspell -d /usr/share/hunspell/en_US ./src/data/resume.yml
