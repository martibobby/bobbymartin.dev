name: Spell Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install hunspell
        run: |
          sudo apt-get update
          sudo apt-get -y install hunspell
          sudo apt-get -y install hunspell-en-us
      ### HUNSPELL Sanity Checks
      # - name: Check hunspell dictionaries
      #   run: hunspell -D
      # - name: Hunspell sanity check
      #   run: echo frqy refries | hunspell -a -d en_US
      ### HUNSPELL Custom Dictionary
      ### HUNSPELL INTERPRETING OUTPUT
      # If the word is not in the dictionary, but there are  near  misses,  then  the  line
      # contains  an '&', a space, the misspelled word, a space, the number of near misses,
      # the number of characters between the beginning of the line and the beginning of the
      # misspelled word, a colon, another space, and a list of the near misses separated by
      # commas and spaces.      
      - name: Spell Check resume.yml
        run: |
          misspelled_lines=$(cat -n ./src/data/resume.yml | hunspell -a -d en_US -p custom-dict | grep -v -E '^\*|^@')
          if [ -n "$misspelled_lines" ]; then
              echo "Found misspellings:"
              echo "$misspelled_lines"
              exit 1
            fi
